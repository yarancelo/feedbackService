# Reverse proxy: the only container exposed to browsers on port 80.
# Hides both the SPA (frontend) and the API (backend) behind one origin,
# served over plain HTTP.
server {
    listen 80;
    server_name _;

    # API calls -> backend. The /api prefix is preserved (FastAPI serves under /api).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> the SPA static server.
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
