# Internal static server for the built SPA.
# (Distinct role from the top-level reverse proxy: this one only serves files.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing fallback
    }
}
