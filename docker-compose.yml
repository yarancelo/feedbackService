# Anonymous employee feedback — full stack, one command:  docker compose up --build
#
# Staged startup:
#   1) postgres            -> waits until healthy
#   2) backend + frontend  -> start only once postgres is healthy
#   3) proxy               -> starts only once backend + frontend are healthy
#
# Ports exposed on the host:  80 (nginx) · 8080 (backend) · 5432 (postgres)

services:
  postgres:
    image: postgres:18-alpine          # PG18 ships the built-in uuidv7() function
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: feedback
    ports:
      - "5432:5432"                     # exposed for manual DB work / provisioning admins
    volumes:
      - pgdata:/var/lib/postgresql   # PG18: mount at /var/lib/postgresql (data lands in a version subdir)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [appnet]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://admin:password@postgres:5432/feedback
      JWT_SECRET: internal-only-change-me-please-set-a-real-secret
      JWT_EXPIRE_MINUTES: "30"
    ports:
      - "8080:8080"                     # exposed for direct API testing
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [appnet]

  frontend:
    build: ./frontend
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started   # static SPA server: ready as soon as it runs
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
